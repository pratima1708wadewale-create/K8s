apiVersion: v1
kind: Pod
metadata:
  name: np-pod
  labels:
    app: np
spec:
  containers:
    - name: my-np-container
      image: nginx:latest
      ports:
        - name: nginx-port
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: np-svc
  labels:
    app: np
spec:
  type: NodePort
  selector: 
    app: np
  ports:
  - name: np-svc-port
    protocol: TCP
    port: 80
    targetPort: 80
