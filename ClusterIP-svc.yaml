apiVersion: v1
kind: Pod
metadata:
  name: cp-pod
  labels:
    app: cp
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    ports:
      - name: nginx-port
        containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cp-svc
  labels:
    app: cp
spec:
  type: ClusterIP
  selector:
    app: cp
  ports:
    - name: clusterip-port
      protocol: TCP
      port: 80
      targetPort: 80
