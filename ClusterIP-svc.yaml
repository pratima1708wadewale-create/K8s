apiVersion: v1
kind: Pod
metadata:
  name: ci-pod
  labels:
    app: myapp
spec:
  containers:
  - name: ci-container
    image: nginx:latest
    ports:
    - name: nginx-port
      containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: ci-svc
  labels:
    app: myapp
type: ClusterIP
selector:
  app: myapp
ports:
  - name: ci-svc-port
    protocol: TCP
    port: 80
    targetPort: 80