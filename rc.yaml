apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
  Labels:
    app: rc
spec:
  replicas: 3
  selector:
    app: rc
    template:
      metadata:
        name: rc-template
        labels:
          app: rc
      spec:
        containers:
        - name: rc-container
          image: nginx:latest
          ports:
          - name: nginx-port
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rc-svc
  labels:
    app: rc
spec:
  type: NodePort
  selector:
    app: rc
  ports:
    port: 80
    targetPort: 80
        